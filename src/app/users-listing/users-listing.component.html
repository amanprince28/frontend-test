<div class="page-container">
  <div class="page-header">
    <h4 class="page-title">User Management</h4>
    <button
      mat-flat-button
      color="primary"
      (click)="onAddClick()"
      [disabled]="userRole === 'AGENT'"
      class="add-btn"
    >
      <mat-icon>add</mat-icon>
      Add User
    </button>
  </div>

  <div class="filter-bar">
    <mat-form-field appearance="outline" class="filter-grow">
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        [(ngModel)]="searchQuery"
        placeholder="Search users..."
        name="searchQuery"
        (keydown.enter)="filterTable()"
      />
    </mat-form-field>
    <button mat-stroked-button color="primary" (click)="filterTable()">
      Filter
    </button>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource" class="table-nowrap">
        <ng-container matColumnDef="customerId">
          <th mat-header-cell *matHeaderCellDef>User Id</th>
          <td mat-cell *matCellDef="let element">{{ element.generate_id }}</td>
        </ng-container>
        
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let element">{{ element.email }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let element">{{ element.role }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let element">
            <span class="status-pill" [class.inactive]="!element.status">
              {{ element.status ? "Active" : "Inactive" }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element" class="actions-cell">
            <div class="action-icons">
              <button
                mat-icon-button
                color="primary"
                (click)="onRowClick(element, 'edit')"
                [disabled]="userRole === 'AGENT'"
                aria-label="Edit"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                color="accent"
                (click)="onRowClick(element, 'view')"
                aria-label="View"
              >
                <mat-icon>visibility</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                (click)="onDelete(element)"
                [disabled]="userRole === 'AGENT'"
                aria-label="Delete"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
    
    <mat-paginator
      [length]="totalCount"
      [pageSize]="pageSize"
      [pageIndex]="currentPage"
      [pageSizeOptions]="[10, 20, 30]"
      (page)="onPageChange($event)"
      showFirstLastButtons
      class="custom-paginator"
    >
    </mat-paginator>
  </div>
</div>
