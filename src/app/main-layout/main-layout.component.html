<mat-drawer-container class="app-container" autosize>
  <mat-drawer
    #drawer
    class="app-sidenav"
    [mode]="isDrawerOpen ? 'side' : 'over'"
    [opened]="isDrawerOpen"
  >
    <nav class="sidenav-menu">

      <!-- Customer - Visible for all users -->
      <a
        class="menu-item"
        [routerLink]="['listing']"
        routerLinkActive="active"
        (click)="closeDrawerOnMobile()"
      >
        <mat-icon>group</mat-icon>
        <span class="menu-label">Customer</span>
      </a>

      <!-- Loan - Visible for all users -->
      <a
        class="menu-item"
        [routerLink]="['loan']"
        routerLinkActive="active"
        (click)="closeDrawerOnMobile()"
      >
        <mat-icon>request_quote</mat-icon>
        <span class="menu-label">Loan</span>
      </a>

      <!-- Agent Receivables Report - Visible for all users (data is limited by role on the server) -->
      <a
        class="menu-item"
        [routerLink]="['agent-receivables-report']"
        routerLinkActive="active"
        (click)="closeDrawerOnMobile()"
      >
        <mat-icon>account_balance_wallet</mat-icon>
        <span class="menu-label">Agent Receivables</span>
      </a>

      <!-- All other menus hidden for VIEWER -->
      <ng-container *ngIf="!onlyViewer()">

        <a
          class="menu-item"
          [routerLink]="['users']"
          routerLinkActive="active"
          *ngIf="!checkUsers"
          (click)="closeDrawerOnMobile()"
        >
          <mat-icon>person</mat-icon>
          <span class="menu-label">Users</span>
        </a>

        <a
          class="menu-item"
          [routerLink]="['customer-check']"
          routerLinkActive="active"
          (click)="closeDrawerOnMobile()"
        >
          <mat-icon>person_search</mat-icon>
          <span class="menu-label">Customer Check</span>
        </a>

        <a
          class="menu-item"
          [routerLink]="['payment']"
          routerLinkActive="active"
          (click)="closeDrawerOnMobile()"
        >
          <mat-icon>payments</mat-icon>
          <span class="menu-label">Payment</span>
        </a>

        <a
          *ngIf="canViewReporting()"
          class="menu-item"
          [routerLink]="['reports']"
          routerLinkActive="active"
          (click)="closeDrawerOnMobile()"
        >
          <mat-icon>assessment</mat-icon>
          <span class="menu-label">Reporting</span>
        </a>

        <a
          class="menu-item"
          [routerLink]="['expense']"
          routerLinkActive="active"
          (click)="closeDrawerOnMobile()"
        >
          <mat-icon>receipt_long</mat-icon>
          <span class="menu-label">Expenses</span>
        </a>

        <a
          class="menu-item"
          [routerLink]="['loan-check']"
          routerLinkActive="active"
          (click)="closeDrawerOnMobile()"
        >
          <mat-icon>fact_check</mat-icon>
          <span class="menu-label">Loan Check</span>
        </a>

        <a
          class="menu-item"
          [routerLink]="['agent-report']"
          routerLinkActive="active"
          (click)="closeDrawerOnMobile()"
        >
          <mat-icon>assignment</mat-icon>
          <span class="menu-label">Agent Report</span>
        </a>

        <a
          class="menu-item"
          [routerLink]="['sales-report']"
          routerLinkActive="active"
          (click)="closeDrawerOnMobile()"
        >
          <mat-icon>bar_chart</mat-icon>
          <span class="menu-label">Sales Report</span>
        </a>

      </ng-container>

    </nav>
  </mat-drawer>

  <div class="app-content">
    <mat-toolbar class="app-toolbar">
      <button
        mat-icon-button
        (click)="toggleDrawer()"
        class="menu-button"
        aria-label="Toggle menu"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <span class="spacer"></span>

      <div class="user-menu">
        <button
          mat-button
          [matMenuTriggerFor]="profileMenu"
          class="user-button"
        >
          <mat-icon class="user-icon">account_circle</mat-icon>
          <span class="user-name">{{ userName }}</span>
        </button>

        <mat-menu #profileMenu="matMenu" class="user-dropdown">
          <button mat-menu-item (click)="changePassword()">
            <mat-icon>vpn_key</mat-icon>
            <span>Change Password</span>
          </button>

          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </div>
    </mat-toolbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="app-footer">
      <span class="version">Build Version: {{ appVersion }}</span>
    </footer>
  </div>
</mat-drawer-container>
